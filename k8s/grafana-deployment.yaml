apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  simple-service-dashboard.json: |
    {
      "annotations": { "list": [] },
      "panels": [
        {
          "type": "graph",
          "title": "HTTP Request Duration (seconds)",
          "targets": [
            {
              "expr": "rate(http_request_duration_seconds_sum[1m]) / rate(http_request_duration_seconds_count[1m])",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "id": 1
        },
        {
          "type": "graph",
          "title": "Requests per Second",
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count[1m]))",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus",
          "id": 2
        }
      ],
      "title": "Simple Service Overview",
      "schemaVersion": 16
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        env:
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: "admin"        # change for production
          - name: GF_PATHS_PROVISIONING
            value: /etc/grafana/provisioning
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning/datasources
          subPath: datasources
        - name: grafana-dashboard-provision
          mountPath: /etc/grafana/provisioning/dashboards
          subPath: dashboards
        - name: grafana-dashboards-json
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-provisioning
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-provision
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-json
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
